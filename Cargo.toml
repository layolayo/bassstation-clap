[package]
name = "bassstation-clap"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Linux CLAP plugin for controlling the 1994 Novation BassStation via MIDI CCs & SysEx"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
midir = "0.10"
crossbeam-channel = "0.5"
